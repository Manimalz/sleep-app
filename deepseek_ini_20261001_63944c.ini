[app]
title = Sleep Well
package.name = sleepwell
package.domain = org.sleepwell

source.dir = .
source.include_exts = py,png,jpg,jpeg,kv,atlas,mp3,ogg,wav,json

version = 1.0.0

requirements = python3,kivy==2.2.1,pyjnius,android

orientation = portrait
fullscreen = 0
android.permissions = WAKE_LOCK,FOREGROUND_SERVICE
android.api = 31
android.minapi = 24
android.ndk = 25b
android.archs = arm64-v8a, armeabi-v7a
android.accept_sdk_license = True
android.allow_backup = True
android.wakelock = True

p4a.branch = master
p4a.bootstrap = sdl2

[buildozer]
log_level = 2
warn_on_root = 1